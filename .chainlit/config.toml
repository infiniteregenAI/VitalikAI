[project]
enable_telemetry = true
user_env = []
session_timeout = 3600
cache = false

[features]
prompt_playground = true
multi_modal = true

[UI]
name = "vitalikAI"
show_readme_as_default = true
description = "Agent Vitalik in a sleek interface."
default_collapse_content = true
default_expand_messages = false
hide_cot = true
hide_footer = true
hide_sidebar = true
# Add this line to reference the custom CSS
custom_css = "/public/custom.css"

[UI.theme.light]
    #background = "#FAFAFA"
    #paper = "#FFFFFF"
    
    [UI.theme.light.primary]
        #main = "#F80061"
        #dark = "#980039"
        #light = "#FFE7EB"

[UI.theme.dark]
    #background = "#FAFAFA"
    #paper = "#FFFFFF"
    
    [UI.theme.dark.primary]
        #main = "#F80061"
        #dark = "#980039"
        #light = "#FFE7EB"

[meta]
generated_by = "0.7.3"